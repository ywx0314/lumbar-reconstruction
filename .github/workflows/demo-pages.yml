name: Deploy reconstruction demo
on:
  push:
    branches: [main, master]
    paths: ['demo/**', 'demo-site.zip']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack website bundle if present
        run: |
          if [ -f demo-site.zip ]; then
            mkdir -p demo
            unzip -oq demo-site.zip -d demo
          fi
      - name: Verify calibrated projection
        run: node demo/web/geometry.test.js
      - uses: actions/configure-pages@v5
      - name: Prepare public demo assets
        run: |
          mkdir -p .pages
          cp demo/index.html demo/README.md .pages/
          cp -r demo/web .pages/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
